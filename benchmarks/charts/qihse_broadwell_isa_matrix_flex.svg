<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="subtleGlow4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad4)"/>

  <!-- Title Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#38bdf8" filter="url(#subtleGlow4)"/>
    <text x="24" y="17" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">ISA ARCHITECTURE</text>

    <text x="0" y="55" fill="#f8fafc" font-size="26" font-weight="800" letter-spacing="-0.5">
      Broadwell-EP Hardware ISA Acceleration Matrix
    </text>
    <text x="615" y="55" fill="#34d399" font-size="26" font-weight="800">
      (17 Feature Families)
    </text>
    <text x="0" y="76" fill="#64748b" font-size="13" font-weight="500">
      Zero static shims or aliases · Pure dynamic runtime dispatch via qihse_cpu_detect() &amp; __attribute__((target(...)))
    </text>
  </g>

  <!-- 6 ISA Family Cards (2 rows x 3 columns) -->
  <g transform="translate(60, 130)">

    <!-- Row 1, Col 1: AVX2 + FMA -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="215" rx="12" fill="url(#cardGrad4)" stroke="#0284c7" stroke-width="1"/>
      <rect x="16" y="16" width="90" height="20" rx="4" fill="#0369a1" opacity="0.4"/>
      <text x="22" y="30" fill="#38bdf8" font-size="10" font-weight="800">256-BIT SIMD</text>

      <text x="16" y="58" fill="#f8fafc" font-size="17" font-weight="700">AVX2 + FMA &amp; F16C</text>
      <text x="16" y="76" fill="#00C9FF" font-size="12" font-weight="600">_mm256_fmadd_ps · _mm256_cvtph_ps</text>

      <text x="16" y="105" fill="#94a3b8" font-size="12">
        • 4-way independent accumulator unrolling (32 floats / 128 bytes per iter)
      </text>
      <text x="16" y="132" fill="#94a3b8" font-size="12">
        • Fused F16C+FMA Layer-0 HNSW traversal
      </text>
      <text x="16" y="159" fill="#94a3b8" font-size="12">
        • 256-bit INT8 &amp; tryte dot products (64 dims/iter)
      </text>
      <text x="16" y="192" fill="#4ade80" font-size="12" font-weight="700">
        Result: 3.89 ms 100K INT8 Search
      </text>
    </g>

    <!-- Row 1, Col 2: BMI1 & BMI2 -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="345" height="215" rx="12" fill="url(#cardGrad4)" stroke="#a855f7" stroke-width="1"/>
      <rect x="16" y="16" width="115" height="20" rx="4" fill="#6b21a8" opacity="0.4"/>
      <text x="22" y="30" fill="#c084fc" font-size="10" font-weight="800">BIT MANIPULATION</text>

      <text x="16" y="58" fill="#f8fafc" font-size="17" font-weight="700">BMI1 &amp; BMI2 + LZCNT</text>
      <text x="16" y="76" fill="#c084fc" font-size="12" font-weight="600">_pext_u64 · _pdep_u64 · bzhi · mulx</text>

      <text x="16" y="105" fill="#94a3b8" font-size="12">
        • 1-cycle FP8 &amp; FP4 sidecar packing &amp; expansion
      </text>
      <text x="16" y="132" fill="#94a3b8" font-size="12">
        • Single-instruction Gorilla XOR mantissa slice
      </text>
      <text x="16" y="159" fill="#94a3b8" font-size="12">
        • Flagless mulx for multi-precision bignum
      </text>
      <text x="16" y="192" fill="#4ade80" font-size="12" font-weight="700">
        Result: 6.44M pts/sec Gorilla timeseries
      </text>
    </g>

    <!-- Row 1, Col 3: Intel TSX (RTM) -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="345" height="215" rx="12" fill="url(#cardGrad4)" stroke="#ec4899" stroke-width="1"/>
      <rect x="16" y="16" width="105" height="20" rx="4" fill="#9d174d" opacity="0.4"/>
      <text x="22" y="30" fill="#f472b6" font-size="10" font-weight="800">SYNCHRONIZATION</text>

      <text x="16" y="58" fill="#f8fafc" font-size="17" font-weight="700">Intel TSX (RTM) Elision</text>
      <text x="16" y="76" fill="#f472b6" font-size="12" font-weight="600">_xbegin · _xend · _xabort · qihse_tsx_rwlock</text>

      <text x="16" y="105" fill="#94a3b8" font-size="12">
        • Lemming-safe fallback_held cache-line guard
      </text>
      <text x="16" y="132" fill="#94a3b8" font-size="12">
        • Elides mutexes in Hash Index &amp; Trinary Trie
      </text>
      <text x="16" y="159" fill="#94a3b8" font-size="12">
        • Non-conflicting threads write concurrently
      </text>
      <text x="16" y="192" fill="#4ade80" font-size="12" font-weight="700">
        Result: 654k ops/sec Lock-Free KV Get
      </text>
    </g>

    <!-- Row 2, Col 1: RDSEED Physical Entropy -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="345" height="215" rx="12" fill="url(#cardGrad4)" stroke="#10b981" stroke-width="1"/>
      <rect x="16" y="16" width="100" height="20" rx="4" fill="#065f46" opacity="0.4"/>
      <text x="22" y="30" fill="#34d399" font-size="10" font-weight="800">QUANTUM ENTROPY</text>

      <text x="16" y="58" fill="#f8fafc" font-size="17" font-weight="700">RDSEED (NIST SP 800-90B/C)</text>
      <text x="16" y="76" fill="#34d399" font-size="12" font-weight="600">_rdseed64_step · OpenSSL 3.5+ PQC DRBG</text>

      <text x="16" y="105" fill="#94a3b8" font-size="12">
        • True physical thermal noise generator
      </text>
      <text x="16" y="132" fill="#94a3b8" font-size="12">
        • Seeds ML-KEM-1024 &amp; ML-DSA-87 keygen
      </text>
      <text x="16" y="159" fill="#94a3b8" font-size="12">
        • Multi-tier conditioning prevents FIFO starvation
      </text>
      <text x="16" y="192" fill="#4ade80" font-size="12" font-weight="700">
        Result: NIST CNSA 2.0 Physical Compliance
      </text>
    </g>

    <!-- Row 2, Col 2: ADX Dual Carry Arithmetic -->
    <g transform="translate(365, 235)">
      <rect x="0" y="0" width="345" height="215" rx="12" fill="url(#cardGrad4)" stroke="#f59e0b" stroke-width="1"/>
      <rect x="16" y="16" width="100" height="20" rx="4" fill="#78350f" opacity="0.4"/>
      <text x="22" y="30" fill="#fbbf24" font-size="10" font-weight="800">MULTI-PRECISION</text>

      <text x="16" y="58" fill="#f8fafc" font-size="17" font-weight="700">ADX (adcx / adox)</text>
      <text x="16" y="76" fill="#fbbf24" font-size="12" font-weight="600">Dual Carry Chains (CF + OF simultaneously)</text>

      <text x="16" y="105" fill="#94a3b8" font-size="12">
        • Independent carry chains across Ports 0 &amp; 6
      </text>
      <text x="16" y="132" fill="#94a3b8" font-size="12">
        • Combined with mulx for 256-bit multi-limb
      </text>
      <text x="16" y="159" fill="#94a3b8" font-size="12">
        • Post-quantum lattice modular arithmetic
      </text>
      <text x="16" y="192" fill="#4ade80" font-size="12" font-weight="700">
        Result: 2x Multi-Limb MAC Throughput
      </text>
    </g>

    <!-- Row 2, Col 3: MOVBE & Wire Crypto -->
    <g transform="translate(730, 235)">
      <rect x="0" y="0" width="345" height="215" rx="12" fill="url(#cardGrad4)" stroke="#6366f1" stroke-width="1"/>
      <rect x="16" y="16" width="105" height="20" rx="4" fill="#312e81" opacity="0.4"/>
      <text x="22" y="30" fill="#818cf8" font-size="10" font-weight="800">WIRE FRAMING</text>

      <text x="16" y="58" fill="#f8fafc" font-size="17" font-weight="700">MOVBE + AES-NI / PCLMUL</text>
      <text x="16" y="76" fill="#818cf8" font-size="12" font-weight="600">movbe · _mm_clmulepi64_si128 · _mm_aesenc</text>

      <text x="16" y="105" fill="#94a3b8" font-size="12">
        • 1-cycle big-endian load/store for QKP / UWP
      </text>
      <text x="16" y="132" fill="#94a3b8" font-size="12">
        • 4-way carryless folding CRC32: 6.018 GiB/s
      </text>
      <text x="16" y="159" fill="#94a3b8" font-size="12">
        • Session-persistent pre-keyed AES-256-GCM AEAD
      </text>
      <text x="16" y="192" fill="#4ade80" font-size="12" font-weight="700">
        Result: 943 Mbps Wire Line Rate
      </text>
    </g>

  </g>

  <!-- Footer Hardware Spec Bar -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1080" height="44" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="27" fill="#94a3b8" font-size="11">
      All 17 Broadwell-EP CPU flags detected and wired natively: AVX · AVX2 · FMA · BMI1 · BMI2 · MOVBE · RDSEED · ADX · RTM · ABM · F16C · AES-NI · PCLMUL · POPCNT · RDRAND · FSGSBASE · ERMS
    </text>
  </g>

</svg>
