<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#92FE9D"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2387"/>
      <stop offset="50%" stop-color="#E94057"/>
      <stop offset="100%" stop-color="#F27121"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0575E6"/>
      <stop offset="100%" stop-color="#00F260"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7971E"/>
      <stop offset="100%" stop-color="#FFD200"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="60" y1="120" x2="1140" y2="120"/>
    <line x1="60" y1="230" x2="1140" y2="230"/>
    <line x1="60" y1="340" x2="1140" y2="340"/>
    <line x1="60" y1="450" x2="1140" y2="450"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#00F260" filter="url(#subtleGlow)"/>
    <text x="24" y="17" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">LIVE TELEMETRY</text>

    <text x="0" y="55" fill="#f8fafc" font-size="26" font-weight="800" letter-spacing="-0.5">
      QIHSE Hardware Acceleration Flex
    </text>
    <text x="475" y="55" fill="#38bdf8" font-size="26" font-weight="800">
      Broadwell-EP (R730xd)
    </text>

    <text x="0" y="76" fill="#64748b" font-size="13" font-weight="500">
      Dual Intel Xeon E5-2690 v4 (28C/56T, 70MB L3) vs Dual Xeon E5-2470 v2 (20C/40T, 50MB L3) Baseline
    </text>
  </g>

  <!-- Top Flex Badges -->
  <g transform="translate(760, 40)">
    <!-- Badge 1: 6.02 GB/s CRC -->
    <rect x="0" y="0" width="180" height="64" rx="12" fill="url(#cardGrad)" stroke="#00C9FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">CRC32 Folding</text>
    <text x="16" y="50" fill="#00F2FE" font-size="22" font-weight="800" filter="url(#subtleGlow)">6.018 GiB/s</text>
    <text x="126" y="50" fill="#4ade80" font-size="12" font-weight="700">+227%</text>

    <!-- Badge 2: 3.89 ms INT8 -->
    <rect x="195" y="0" width="185" height="64" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="211" y="24" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">100K INT8 Search</text>
    <text x="211" y="50" fill="#c084fc" font-size="22" font-weight="800" filter="url(#subtleGlow)">3.89 ms</text>
    <text x="312" y="50" fill="#4ade80" font-size="12" font-weight="700">7.9x vs Init</text>
  </g>

  <!-- Main Benchmark Cards Container -->
  <g transform="translate(60, 140)">

    <!-- Workload 1: CRC32 Carryless Folding -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1080" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#f1f5f9" font-size="14" font-weight="700">WAL / Replication Stream IEEE CRC32</text>
      <text x="20" y="52" fill="#64748b" font-size="12">4-Way PCLMULQDQ carryless folding + BMI1 bit manipulation</text>

      <!-- Baseline Bar -->
      <rect x="360" y="16" width="150" height="18" rx="4" fill="#334155"/>
      <text x="520" y="30" fill="#94a3b8" font-size="12" font-weight="600">1.84 GiB/s (Ivy Bridge)</text>

      <!-- Broadwell Bar -->
      <rect x="360" y="40" width="490" height="18" rx="4" fill="url(#cyanGrad)" filter="url(#subtleGlow)"/>
      <text x="860" y="54" fill="#00F2FE" font-size="13" font-weight="800">6.018 GiB/s (730xd Broadwell)</text>
      <text x="1025" y="43" fill="#4ade80" font-size="16" font-weight="800">3.27x</text>
    </g>

    <!-- Workload 2: 100,000 Vectors INT8 Quantized Search -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="1080" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#f1f5f9" font-size="14" font-weight="700">100,000 Vector Search (INT8 Quantized, k=10)</text>
      <text x="20" y="52" fill="#64748b" font-size="12">256-bit AVX2 _mm256_cvtepi8_epi16 + _mm256_madd_epi16 (64 dims/iter)</text>

      <!-- Baseline Latency (Longer is slower) -->
      <rect x="360" y="16" width="380" height="18" rx="4" fill="#475569"/>
      <text x="750" y="30" fill="#94a3b8" font-size="12" font-weight="600">31.0 ms (Scalar Baseline)</text>

      <!-- Broadwell Latency (Shorter is faster) -->
      <rect x="360" y="40" width="50" height="18" rx="4" fill="url(#purpleGrad)" filter="url(#subtleGlow)"/>
      <text x="420" y="54" fill="#fb7185" font-size="13" font-weight="800">3.89 ms (730xd Broadwell AVX2)</text>
      <text x="1025" y="43" fill="#4ade80" font-size="16" font-weight="800">7.97x</text>
    </g>

    <!-- Workload 3: 10,000 Vectors HNSW Graph Search -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="1080" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#f1f5f9" font-size="14" font-weight="700">10,000 Vector HNSW Graph Traversal (k=10)</text>
      <text x="20" y="52" fill="#64748b" font-size="12">Fused F16C+FMA Layer-0 leaf traversal with prefetching</text>

      <!-- Baseline Bar -->
      <rect x="360" y="16" width="420" height="18" rx="4" fill="#334155"/>
      <text x="790" y="30" fill="#94a3b8" font-size="12" font-weight="600">1,049 µs (Non-FMA Baseline)</text>

      <!-- Broadwell Bar -->
      <rect x="360" y="40" width="70" height="18" rx="4" fill="url(#emeraldGrad)" filter="url(#subtleGlow)"/>
      <text x="440" y="54" fill="#34d399" font-size="13" font-weight="800">176.0 µs (730xd Fused FMA)</text>
      <text x="1025" y="43" fill="#4ade80" font-size="16" font-weight="800">5.96x</text>
    </g>

    <!-- Workload 4: Gorilla Timeseries Decompression -->
    <g transform="translate(0, 264)">
      <rect x="0" y="0" width="1080" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#f1f5f9" font-size="14" font-weight="700">Gorilla XOR Timeseries Stream Decompression</text>
      <text x="20" y="52" fill="#64748b" font-size="12">64-bit MOVBE big-endian load + BMI2 _bzhi_u64 / shrx (zero-loop 3 cycles)</text>

      <!-- Baseline Bar -->
      <rect x="360" y="16" width="110" height="18" rx="4" fill="#334155"/>
      <text x="480" y="30" fill="#94a3b8" font-size="12" font-weight="600">1.20M pts/sec (Scalar Bit-by-Bit)</text>

      <!-- Broadwell Bar -->
      <rect x="360" y="40" width="520" height="18" rx="4" fill="url(#goldGrad)" filter="url(#subtleGlow)"/>
      <text x="890" y="54" fill="#facc15" font-size="13" font-weight="800">6.44M pts/sec (MOVBE + BMI2)</text>
      <text x="1025" y="43" fill="#4ade80" font-size="16" font-weight="800">5.37x</text>
    </g>

    <!-- Workload 5: KV In-Memory Point Retrieval -->
    <g transform="translate(0, 352)">
      <rect x="0" y="0" width="1080" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#f1f5f9" font-size="14" font-weight="700">In-Memory Hash Index &amp; Trinary Trie Get</text>
      <text x="20" y="52" fill="#64748b" font-size="12">Hardware _mm_crc32_u64 + AESENC probe + TSX (RTM) hardware lock elision</text>

      <!-- Baseline Bar -->
      <rect x="360" y="16" width="310" height="18" rx="4" fill="#334155"/>
      <text x="680" y="30" fill="#94a3b8" font-size="12" font-weight="600">418,143 ops/sec (Mutex Bound)</text>

      <!-- Broadwell Bar -->
      <rect x="360" y="40" width="480" height="18" rx="4" fill="url(#violetGrad)" filter="url(#subtleGlow)"/>
      <text x="850" y="54" fill="#e879f9" font-size="13" font-weight="800">654,918 ops/sec (TSX Elision)</text>
      <text x="1025" y="43" fill="#4ade80" font-size="16" font-weight="800">1.57x</text>
    </g>

  </g>

  <!-- Footer Hardware Spec Bar -->
  <g transform="translate(60, 595)">
    <rect x="0" y="0" width="1080" height="48" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.5">HARDWARE ISA ENGINE</text>
    <text x="20" y="38" fill="#94a3b8" font-size="11">
      Intel Broadwell-EP · AVX2 · FMA3 · BMI1 · BMI2 · MOVBE · RDSEED · ADX · TSX (RTM) · ABM (LZCNT) · AES-NI · PCLMULQDQ · FSGSBASE · ERMS
    </text>

    <text x="890" y="29" fill="#38bdf8" font-size="12" font-weight="700">QIHSE Engine v1.0.0</text>
    <circle cx="1045" cy="25" r="4" fill="#00F260" filter="url(#subtleGlow)"/>
  </g>

</svg>
