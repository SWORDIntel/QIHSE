name: QIHSE Heterogeneous Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # CI fixtures have no persistent ML-KEM material. Production has no opt-in.
    env:
      QIHSE_ALLOW_INSECURE_CONTAINER: '1'
    container: debian:trixie

    steps:
    - name: Install Checkout Dependencies
      run: apt-get update && apt-get install -y git ca-certificates

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        apt-get update
        apt-get install -y build-essential gcc g++ libpthread-stubs0-dev libssl-dev liburing-dev libsqlite3-dev libluajit-5.1-dev libbpf-dev libxdp-dev clang ninja-build cmake python3-dev python3-pip python3-numpy libarchive-dev libzstd-dev libicu-dev nlohmann-json3-dev nodejs npm cargo

    - name: Build Shared Library & Binaries
      run: |
        set -o pipefail
        make clean
        make all -j$(nproc) 2>&1 | tee qihse-build.log

    - name: Upload Native Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-native-build-log
        path: qihse-build.log
        if-no-files-found: error

    - name: Verify Library Exports
      run: |
        nm -D ./libqihse.so | grep qihse_search || true

    - name: Prepare isolated test state
      run: mkdir -p build && chmod 0700 build

    - name: Verify I2P setup syntax
      run: bash -n scripts/setup_i2p_replication.sh

    - name: Run Classified Adapter Denial Regression
      run: make test-consensus-mesh

    - name: Run Machine Token Security Regression
      run: make test-machine-auth

    - name: Run Fabric Index Authorization Regression (independent)
      run: make test-fabric-index

    - name: Python Fleet Protocol Security Regressions
      run: |
        python3 -m py_compile python/qihse/thermal.py tools/fleet/qihse-fan-agent.py
        python3 -m unittest discover -s python/tests -p 'test_fleet_resp_security.py' -v

    - name: Verify authentication rate limiter is fail-closed
      run: make test-rate-limit-fail-closed

    - name: Verify persistence rejects missing HMAC material
      run: make test-container-key-gate

    - name: Validate atomic container flush and WAL inode continuity
      run: make test-container-flush-locking

    - name: Run Native HTTP API Hardening Regressions
      run: make test-http-adapters test-phase-c

    - name: Run Core Test Suite
      run: |
        set -o pipefail
        make test 2>&1 | tee qihse-core-test.log

    - name: Upload Core Test Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-core-test-log
        path: qihse-core-test.log
        if-no-files-found: error

    - name: Run APT41 Fuzz Testing (ASan & UBSan)
      run: |
        make test-apt41

    - name: Run Auth Privilege Boundary Regression
      run: |
        make test-auth-privilege-boundary

    - name: Run Object ACL Regression
      run: |
        make test-object-acl

    - name: Run Fabric Index Authorization Regression
      run: |
        make test-fabric-index

    - name: Run Aggregate Hardening Regression
      run: |
        make test-aggregate-hardened

    - name: Run FTS Persistence Authorization Regression
      run: |
        make test-fts-persistence-auth

    - name: Run Security Boundary Regressions
      run: |
        make -f Makefile -f tests/security-regression.mk test-security-regressions

    - name: Run Cluster Brain Unit Tests
      run: |
        make test-cluster-brain

    - name: Run Brain Actuation Tests
      run: |
        make test-brain-actuate

    - name: Run Brain Rebalance and Prune Tests
      run: |
        make test-brain-rebalance

    - name: Run Overlay Protocol Unit Tests
      run: |
        make test-overlay

    - name: Run Federation F0 Primitive Tests
      run: |
        make test-federation-f0

    - name: Run Federation Consensus Tests
      run: |
        make test-consensus

    - name: Run Backup Authentication Regression
      run: |
        make test-backup-auth

    - name: Run Federation CA Provisioning Tests
      run: |
        make test-federation-ca

    - name: Run Federation CRL Loader Tests
      run: |
        make test-federation-crl

    - name: Run Incremental Export Tests
      run: |
        make test-incremental-export

    - name: Run AI Memory Tests
      run: |
        make test-ai-memory

    - name: Run Python SDK Tests
      run: |
        export LD_LIBRARY_PATH=$PWD
        PYTHONPATH=python python3 -m unittest discover -s python/tests

    - name: Run Rust Controller SDK Tests
      run: |
        cd rust/qihse-rs
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE
        cargo test --locked --test controller_sdk
        cargo test --locked --lib 'controller::'

  sanitizers:
    runs-on: ubuntu-latest
    env:
      QIHSE_ALLOW_INSECURE_CONTAINER: '1'
    container: debian:trixie

    steps:
    - name: Install Checkout Dependencies
      run: apt-get update && apt-get install -y git ca-certificates

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        apt-get update
        apt-get install -y build-essential gcc g++ libpthread-stubs0-dev libssl-dev liburing-dev libsqlite3-dev libluajit-5.1-dev libbpf-dev libxdp-dev clang ninja-build cmake python3-dev python3-pip python3-numpy libarchive-dev libzstd-dev libicu-dev nlohmann-json3-dev nodejs npm cargo

    - name: Build Sanitized Shared Library
      run: |
        set -o pipefail
        make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" lib -j$(nproc) 2>&1 | tee qihse-sanitizer-build.log

    - name: Upload Sanitizer Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-sanitizer-build-log
        path: qihse-sanitizer-build.log
        if-no-files-found: error

    - name: Prepare isolated sanitizer state
      run: mkdir -p build && chmod 0700 build

    - name: Verify fail-closed container key admission under sanitizers
      run: make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-container-key-gate

    - name: Run Sanitized Security Regressions (ASan + UBSan)
      run: |
        set -o pipefail
        export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
        export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
        export LD_LIBRARY_PATH=$PWD
        {
          make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-resp-cluster
          make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-auth-privilege-boundary test-object-acl test-fabric-index test-aggregate-hardened test-fts-persistence-auth test-apt41
          make -f Makefile -f tests/security-regression.mk QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-security-regressions
        } 2>&1 | tee qihse-sanitizer-test.log

    - name: Upload Sanitizer Test Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-sanitizer-test-log
        path: qihse-sanitizer-test.log
        if-no-files-found: error

  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - name: Install dashboard dependencies
      run: npm ci

    - name: Lint dashboard
      run: npm run lint

    - name: Build dashboard
      run: npm run build

  studio-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: portal/src/Qihse.Studio.Client/package-lock.json
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Validate Studio client and server
      run: |
        set -euo pipefail
        npm --prefix portal/src/Qihse.Studio.Client ci
        npm --prefix portal/src/Qihse.Studio.Client run build
        dotnet build portal/src/Qihse.Studio.Server -c Release
    - name: Test Studio authentication boundaries
      run: |
        set -euo pipefail
        export QIHSE_STUDIO_API_TOKEN=CI-test-secret-0123456789abcdef0123456789abcdef
        dotnet run --no-build -c Release --no-launch-profile --project portal/src/Qihse.Studio.Server --urls http://127.0.0.1:5100 > studio.log 2>&1 &
        child=$!
        trap 'kill "$child" 2>/dev/null || true' EXIT
        for attempt in $(seq 1 30); do
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5100/api/telemetry/snapshot || true)
          [ "$status" = 401 ] && break
          sleep 1
        done
        test "$status" = 401
        test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:5100/api/telemetry/snapshot)" = 401
        test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $QIHSE_STUDIO_API_TOKEN" http://127.0.0.1:5100/api/telemetry/snapshot)" = 200
        test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $QIHSE_STUDIO_API_TOKEN" -H 'Content-Type: application/json' -d '{"topK":5}' http://127.0.0.1:5100/api/vector/search)" = 501
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5100/hub/telemetry/negotiate)" = 401
