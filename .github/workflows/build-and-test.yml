name: QIHSE Heterogeneous Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ libpthread-stubs0-dev libssl-dev liburing-dev libsqlite3-dev libluajit-5.1-dev libbpf-dev libxdp-dev clang ninja-build cmake python3-dev python3-pip python3-numpy libarchive-dev libzstd-dev nlohmann-json3-dev

    - name: Build Shared Library & Binaries
      run: |
        set -o pipefail
        make clean
        make all -j$(nproc) 2>&1 | tee qihse-build.log

    - name: Upload Native Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-native-build-log
        path: qihse-build.log
        if-no-files-found: error

    - name: Verify Library Exports
      run: |
        nm -D ./libqihse.so | grep qihse_search || true

    - name: Run Core Test Suite
      run: |
        set -o pipefail
        make test 2>&1 | tee qihse-core-test.log

    - name: Upload Core Test Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-core-test-log
        path: qihse-core-test.log
        if-no-files-found: error

    - name: Run Auth Privilege Boundary Regression
      run: |
        make test-auth-privilege-boundary

    - name: Run Object ACL Regression
      run: |
        make test-object-acl

    - name: Run Aggregate Hardening Regression
      run: |
        make test-aggregate-hardened

    - name: Run FTS Persistence Authorization Regression
      run: |
        make test-fts-persistence-auth

    - name: Run Security Boundary Regressions
      run: |
        make -f Makefile -f tests/security-regression.mk test-security-regressions

    - name: Run APT41 Fuzz Testing (ASan & UBSan)
      run: |
        make test-apt41

    - name: Run Python SDK Tests
      run: |
        export LD_LIBRARY_PATH=$PWD
        PYTHONPATH=python python3 -m unittest discover -s python/tests

  sanitizers:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ libpthread-stubs0-dev libssl-dev liburing-dev libsqlite3-dev libluajit-5.1-dev libbpf-dev libxdp-dev clang ninja-build cmake python3-dev python3-pip python3-numpy libarchive-dev libzstd-dev nlohmann-json3-dev

    - name: Build Sanitized Shared Library
      run: |
        set -o pipefail
        make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" lib -j$(nproc) 2>&1 | tee qihse-sanitizer-build.log

    - name: Upload Sanitizer Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-sanitizer-build-log
        path: qihse-sanitizer-build.log
        if-no-files-found: error

    - name: Run Sanitized Security Regressions (ASan + UBSan)
      run: |
        set -o pipefail
        export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
        export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
        export LD_LIBRARY_PATH=$PWD
        {
          make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-resp-cluster
          make QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-auth-privilege-boundary test-object-acl test-aggregate-hardened test-fts-persistence-auth test-apt41
          make -f Makefile -f tests/security-regression.mk QIHSE_CFLAGS_EXTRA="-fsanitize=address,undefined -g -fno-omit-frame-pointer" test-security-regressions
        } 2>&1 | tee qihse-sanitizer-test.log

    - name: Upload Sanitizer Test Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-sanitizer-test-log
        path: qihse-sanitizer-test.log
        if-no-files-found: error

  resp-native-debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Debug Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ gdb libpthread-stubs0-dev libssl-dev liburing-dev libsqlite3-dev libluajit-5.1-dev libbpf-dev libxdp-dev clang ninja-build cmake python3-dev python3-pip python3-numpy libarchive-dev libzstd-dev nlohmann-json3-dev

    - name: Build Native Library With Symbols
      run: |
        make clean
        make QIHSE_CFLAGS_EXTRA="-g -fno-omit-frame-pointer" lib -j$(nproc)

    - name: Compile RESP Cluster Regression Without Running It
      run: |
        set -euo pipefail
        make -n QIHSE_CFLAGS_EXTRA="-g -fno-omit-frame-pointer" test-resp-cluster \
          | grep -m1 -E '(^| )gcc .*tests/test_resp_cluster\.c' \
          | sh

    - name: Run RESP Cluster Regression Under GDB
      run: |
        set -o pipefail
        export LD_LIBRARY_PATH=$PWD
        gdb -q -batch -return-child-result \
          -ex 'set pagination off' \
          -ex run \
          -ex 'thread apply all bt full' \
          --args ./tests/test_resp_cluster 2>&1 | tee qihse-resp-native-gdb.log

    - name: Upload RESP Native Backtrace
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qihse-resp-native-gdb-log
        path: qihse-resp-native-gdb.log
        if-no-files-found: error

  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - name: Install dashboard dependencies
      run: npm ci

    - name: Lint dashboard
      run: npm run lint

    - name: Build dashboard
      run: npm run build
