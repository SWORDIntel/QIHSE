name: QIHSE Heterogeneous Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-11 g++-11 libpthread-stubs0-dev
        
    - name: Build Shared Library
      run: |
        make clean
        make all -j$(nproc)

    - name: Verify Library Exports
      run: |
        nm -D ./libqihse.so | grep qihse_search || true
        nm -D ./libqihse.so | grep qihse_cuda || true

    - name: Run Core Test Suite
      run: |
        make test-persist || true
        make test-trinary-codec || true

    - name: Verify Graceful Fallback
      run: |
        chmod +x scripts/verify_fallback.sh
        ./scripts/verify_fallback.sh

    - name: Python Smoke Test
      run: |
        pip install numpy
        export LD_LIBRARY_PATH=$PWD
        python3 python/qihse.py || true
